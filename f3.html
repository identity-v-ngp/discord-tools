<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F3 - 反应交集分析</title>
  <link rel="stylesheet" href="/shared/style.css">
</head>
<body>

  <div class="container">
    <h1>F3 · 反应交集分析</h1>
    <p class="desc">找出对多条消息点过反应的用户</p>

    <!-- token 输入区（由 core.js 动态生成） -->
    <div id="tokenArea"></div>

    <!-- 消息链接输入区 -->
    <div class="field">
      <label for="linksInput">消息链接（每行一条）</label>
      <textarea id="linksInput" rows="6"
        placeholder="https://discord.com/channels/服务器ID/频道ID/消息ID&#10;https://discord.com/channels/服务器ID/频道ID/消息ID"></textarea>
    </div>

    <!-- 阈值设置区 -->
    <div class="threshold-row">
      <div class="field field-inline">
        <label for="thresholdN">重合阈值 N</label>
        <input type="number" id="thresholdN" min="1" value="" placeholder="默认=消息总数">
      </div>
      <div class="field field-inline">
        <label for="thresholdMode">匹配模式</label>
        <select id="thresholdMode">
          <option value="gte">N 个及以上</option>
          <option value="eq">恰好 N 个消息</option>
        </select>
      </div>
    </div>

    <!-- 操作按钮 -->
    <button class="btn" id="startBtn">开始分析</button>

    <!-- 进度提示 -->
    <div class="progress" id="progress"></div>

    <!-- 结果显示区 -->
    <div class="result" id="result"></div>
  </div>

  <script type="module">
    import { createTokenInput, callDiscord } from '/shared/core.js';

    // 初始化 token 输入框
    const tokenInput = createTokenInput(document.getElementById('tokenArea'));

    const linksInput = document.getElementById('linksInput');
    const thresholdN = document.getElementById('thresholdN');
    const thresholdMode = document.getElementById('thresholdMode');
    const startBtn = document.getElementById('startBtn');
    const progressEl = document.getElementById('progress');
    const resultEl = document.getElementById('result');

    // 用户信息缓存：key=用户ID，value={name, avatar}
    // 拉取 reaction 用户时顺便存入，展示结果时直接读取，避免额外请求
    const userCache = new Map();

    /**
     * 从 Discord 消息链接中提取 频道ID 和 消息ID
     * 链接格式：https://discord.com/channels/服务器ID/频道ID/消息ID
     */
    function parseLink(link) {
      const parts = link.trim().split('/');
      // 倒数第1个是消息ID，倒数第2个是频道ID
      const messageId = parts[parts.length - 1];
      const channelId = parts[parts.length - 2];
      if (!channelId || !messageId) return null;
      return { channelId, messageId };
    }

    /**
     * 获取某条消息上所有反应用户的完整集合（自动分页）
     * @param {Function} onProgress - 分页进度回调，接收已拉取的用户数
     * @returns {Set<string>} 用户ID集合
     */
    async function getReactionUsers(token, channelId, messageId, onProgress) {
      const userSet = new Set();

      // 第一步：获取消息对象，看它有哪些 reaction
      const msg = await callDiscord(token, 'GET',
        '/channels/' + channelId + '/messages/' + messageId);

      if (!msg.reactions || msg.reactions.length === 0) {
        return userSet; // 这条消息没有任何反应
      }

      // 第二步：逐个表情拉取所有点过的用户
      for (const reaction of msg.reactions) {
        // emoji 可能是 Unicode 或自定义表情（name:id 格式）
        // 自定义表情需要 URL 编码，Unicode 表情也需要编码
        const emojiStr = reaction.emoji.id
          ? encodeURIComponent(reaction.emoji.name + ':' + reaction.emoji.id)
          : encodeURIComponent(reaction.emoji.name);

        let after = null; // 分页游标

        // 循环分页，直到取完所有用户
        while (true) {
          let query = '/channels/' + channelId + '/messages/' + messageId
            + '/reactions/' + emojiStr + '?limit=100';
          if (after) query += '&after=' + after;

          const users = await callDiscord(token, 'GET', query);

          if (!users || users.length === 0) break;

          // 把用户ID加入集合（自动去重），同时缓存用户信息
          for (const u of users) {
            userSet.add(u.id);
            // 如果缓存里还没有这个用户，就存入（优先用 global_name）
            if (!userCache.has(u.id)) {
              userCache.set(u.id, {
                name: u.global_name || u.username,
                avatar: u.avatar
                  ? 'https://cdn.discordapp.com/avatars/' + u.id + '/' + u.avatar + '.png'
                  : 'https://cdn.discordapp.com/embed/avatars/0.png'
              });
            }
          }

          // 通知外部当前分页进度
          if (onProgress) onProgress(userSet.size);

          // 如果返回不足 100 个，说明已经取完
          if (users.length < 100) break;

          // 否则用最后一个用户ID作为下一页的起点
          after = users[users.length - 1].id;
        }
      }

      return userSet;
    }

    // 点击"开始分析"按钮
    startBtn.addEventListener('click', async () => {
      const token = tokenInput.value.trim();
      const links = linksInput.value.trim().split('\n').filter(l => l.trim());

      // 基本校验
      if (!token) {
        resultEl.textContent = '请先输入 Bot Token';
        resultEl.className = 'result error';
        return;
      }
      if (links.length < 2) {
        resultEl.textContent = '请至少输入 2 条消息链接';
        resultEl.className = 'result error';
        return;
      }

      // 解析所有链接
      const parsed = links.map(parseLink).filter(Boolean);
      if (parsed.length < 2) {
        resultEl.textContent = '有效链接不足 2 条，请检查格式';
        resultEl.className = 'result error';
        return;
      }

      const totalMessages = parsed.length;

      // 阈值校验：N 不能小于 1，不能大于消息总数
      const nVal = thresholdN.value.trim();
      const N = nVal === '' ? totalMessages : parseInt(nVal, 10);
      if (isNaN(N) || N < 1) {
        resultEl.textContent = '阈值 N 不能小于 1';
        resultEl.className = 'result error';
        return;
      }
      if (N > totalMessages) {
        resultEl.textContent = '阈值 N（' + N + '）不能大于消息总数（' + totalMessages + '）';
        resultEl.className = 'result error';
        return;
      }

      const mode = thresholdMode.value; // "gte" 或 "eq"

      // 开始分析
      startBtn.disabled = true;
      resultEl.textContent = '';
      resultEl.className = 'result';

      try {
        // 用 Map 记录每个用户在多少条消息里反应过
        const userCount = new Map();

        // 逐条消息获取反应用户
        for (let i = 0; i < totalMessages; i++) {
          const msgIndex = i + 1;
          progressEl.textContent = '正在处理第 ' + msgIndex + ' / ' + totalMessages + ' 条消息...';

          const { channelId, messageId } = parsed[i];

          // 传入分页进度回调，实时更新进度文字
          const users = await getReactionUsers(token, channelId, messageId, (count) => {
            progressEl.textContent = '第 ' + msgIndex + ' / ' + totalMessages + ' 条消息：已拉取 ' + count + ' 个反应用户...';
          });

          // 统计每个用户出现的次数
          for (const uid of users) {
            userCount.set(uid, (userCount.get(uid) || 0) + 1);
          }
        }

        progressEl.textContent = '正在筛选符合条件的用户...';

        // 根据阈值和模式筛选
        const matched = [];
        for (const [uid, count] of userCount) {
          if (mode === 'gte' && count >= N) {
            matched.push(uid);
          } else if (mode === 'eq' && count === N) {
            matched.push(uid);
          }
        }

        // 展示结果
        if (matched.length === 0) {
          const modeText = mode === 'gte' ? '在 ' + N + ' 个及以上消息' : '恰好在 ' + N + ' 个消息';
          resultEl.textContent = '没有找到' + modeText + '点过反应的用户。';
          resultEl.className = 'result';
        } else {
          const modeText = mode === 'gte' ? '≥ ' + N + ' 条消息' : '恰好 ' + N + ' 条消息';
          let html = '<strong>符合条件的用户（' + matched.length + ' 人，' + modeText + '）：</strong><br><br>';
          html += '<div class="user-list">';
          for (const id of matched) {
            // 从缓存取出用户名和头像（拉取时已存入，无需额外请求）
            const info = userCache.get(id) || { name: '未知用户', avatar: 'https://cdn.discordapp.com/embed/avatars/0.png' };
            html += '<div class="user-item">'
              + '<img class="user-avatar" src="' + info.avatar + '" alt="" width="32" height="32">'
              + '<span class="user-name">' + info.name + '</span>'
              + '<span class="user-id">' + id + '</span>'
              + '</div>';
          }
          html += '</div>';
          html += '<button class="btn btn-sm" id="copyBtn">一键复制所有ID</button>';
          resultEl.innerHTML = html;
          resultEl.className = 'result success';

          // 绑定复制按钮
          document.getElementById('copyBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(matched.join('\n'));
            document.getElementById('copyBtn').textContent = '已复制 ✅';
          });
        }
      } catch (err) {
        resultEl.textContent = '分析失败：' + err.message;
        resultEl.className = 'result error';
      } finally {
        startBtn.disabled = false;
        progressEl.textContent = '';
      }
    });
  </script>

</body>
</html>
