<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F3 - 反应交集分析</title>
  <link rel="stylesheet" href="/shared/style.css">
</head>
<body>

  <div class="container">
    <h1>F3 · 反应交集分析</h1>
    <p class="desc">找出同时对多条消息点过反应的用户</p>

    <!-- token 输入区（由 core.js 动态生成） -->
    <div id="tokenArea"></div>

    <!-- 消息链接输入区 -->
    <div class="field">
      <label for="linksInput">消息链接（每行一条）</label>
      <textarea id="linksInput" rows="6"
        placeholder="https://discord.com/channels/服务器ID/频道ID/消息ID&#10;https://discord.com/channels/服务器ID/频道ID/消息ID"></textarea>
    </div>

    <!-- 操作按钮 -->
    <button class="btn" id="startBtn">开始分析</button>

    <!-- 进度提示 -->
    <div class="progress" id="progress"></div>

    <!-- 结果显示区 -->
    <div class="result" id="result"></div>
  </div>

  <script type="module">
    import { createTokenInput, callDiscord } from '/shared/core.js';

    // 初始化 token 输入框
    const tokenInput = createTokenInput(document.getElementById('tokenArea'));

    const linksInput = document.getElementById('linksInput');
    const startBtn = document.getElementById('startBtn');
    const progressEl = document.getElementById('progress');
    const resultEl = document.getElementById('result');

    /**
     * 从 Discord 消息链接中提取 频道ID 和 消息ID
     * 链接格式：https://discord.com/channels/服务器ID/频道ID/消息ID
     */
    function parseLink(link) {
      const parts = link.trim().split('/');
      // 倒数第1个是消息ID，倒数第2个是频道ID
      const messageId = parts[parts.length - 1];
      const channelId = parts[parts.length - 2];
      if (!channelId || !messageId) return null;
      return { channelId, messageId };
    }

    /**
     * 获取某条消息上所有反应用户的完整集合（自动分页）
     * @returns {Set<string>} 用户ID集合
     */
    async function getReactionUsers(token, channelId, messageId) {
      const userSet = new Set();

      // 第一步：获取消息对象，看它有哪些 reaction
      const msg = await callDiscord(token, 'GET',
        '/channels/' + channelId + '/messages/' + messageId);

      if (!msg.reactions || msg.reactions.length === 0) {
        return userSet; // 这条消息没有任何反应
      }

      // 第二步：逐个表情拉取所有点过的用户
      for (const reaction of msg.reactions) {
        // emoji 可能是 Unicode 或自定义表情（name:id 格式）
        // 自定义表情需要 URL 编码，Unicode 表情也需要编码
        const emojiStr = reaction.emoji.id
          ? encodeURIComponent(reaction.emoji.name + ':' + reaction.emoji.id)
          : encodeURIComponent(reaction.emoji.name);

        let after = null; // 分页游标

        // 循环分页，直到取完所有用户
        while (true) {
          let query = '/channels/' + channelId + '/messages/' + messageId
            + '/reactions/' + emojiStr + '?limit=100';
          if (after) query += '&after=' + after;

          const users = await callDiscord(token, 'GET', query);

          if (!users || users.length === 0) break;

          // 把用户ID加入集合（自动去重）
          for (const u of users) {
            userSet.add(u.id);
          }

          // 如果返回不足 100 个，说明已经取完
          if (users.length < 100) break;

          // 否则用最后一个用户ID作为下一页的起点
          after = users[users.length - 1].id;
        }
      }

      return userSet;
    }

    // 点击"开始分析"按钮
    startBtn.addEventListener('click', async () => {
      const token = tokenInput.value.trim();
      const links = linksInput.value.trim().split('\n').filter(l => l.trim());

      // 基本校验
      if (!token) {
        resultEl.textContent = '请先输入 Bot Token';
        resultEl.className = 'result error';
        return;
      }
      if (links.length < 2) {
        resultEl.textContent = '请至少输入 2 条消息链接';
        resultEl.className = 'result error';
        return;
      }

      // 解析所有链接
      const parsed = links.map(parseLink).filter(Boolean);
      if (parsed.length < 2) {
        resultEl.textContent = '有效链接不足 2 条，请检查格式';
        resultEl.className = 'result error';
        return;
      }

      // 开始分析
      startBtn.disabled = true;
      resultEl.textContent = '';
      resultEl.className = 'result';

      try {
        const sets = [];

        // 逐条消息获取反应用户
        for (let i = 0; i < parsed.length; i++) {
          progressEl.textContent = '正在获取第 ' + (i + 1) + '/' + parsed.length + ' 条消息的反应用户...';
          const { channelId, messageId } = parsed[i];
          const users = await getReactionUsers(token, channelId, messageId);
          sets.push(users);
        }

        progressEl.textContent = '正在计算交集...';

        // 求所有集合的交集
        let intersection = sets[0];
        for (let i = 1; i < sets.length; i++) {
          intersection = new Set([...intersection].filter(id => sets[i].has(id)));
        }

        // 展示结果
        if (intersection.size === 0) {
          resultEl.textContent = '没有找到同时对所有消息都点过反应的用户。';
          resultEl.className = 'result';
        } else {
          // 为了显示用户名，需要从 API 获取用户信息
          // 这里我们只展示用户ID（获取用户名需要额外请求，暂不实现）
          const ids = [...intersection];
          let html = '<strong>交集用户（' + ids.length + ' 人）：</strong><br><br>';
          html += '<div class="user-list">';
          for (const id of ids) {
            html += '<div class="user-item">' + id + '</div>';
          }
          html += '</div>';
          html += '<button class="btn btn-sm" id="copyBtn">一键复制所有ID</button>';
          resultEl.innerHTML = html;
          resultEl.className = 'result success';

          // 绑定复制按钮
          document.getElementById('copyBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(ids.join('\n'));
            document.getElementById('copyBtn').textContent = '已复制 ✅';
          });
        }
      } catch (err) {
        resultEl.textContent = '分析失败：' + err.message;
        resultEl.className = 'result error';
      } finally {
        startBtn.disabled = false;
        progressEl.textContent = '';
      }
    });
  </script>

</body>
</html>
